<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050508">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Pixel HellRun</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="wrap" aria-label="Pixel HellRun o‘yini">
<header id="toolbar"><span class="brand">PIXEL <b>HELLRUN</b></span><div class="toolbar-actions"><button id="soundBtn" class="tool" aria-label="Ovozni o‘chirish" aria-pressed="false">OVOZ: ON</button><button id="pauseBtn" class="tool" aria-label="Pauza" disabled>Ⅱ PAUZA</button></div></header>
<div id="hud">
<div><div class="hl">BALL</div><div class="hv" id="sV">0</div></div>
<div><div class="hl">DARAJA</div><div class="hv" id="lV">1 / 100</div></div>
<div><div class="hl">TANGA</div><div class="hv" id="cV">0 / 10</div></div>
<div><div class="hl">HAYOT</div><div class="hearts" id="hrts"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></div></div>
<div><div class="hl">VAQT</div><div class="hv" id="tV">60</div></div>
</div>
<div id="stage">
<canvas id="c" width="680" height="340" aria-label="O‘yin maydoni"></canvas>
<div id="lvlflash" aria-live="polite"></div>
<div id="ov"><h1>PIXEL<br><span>HELLRUN</span></h1><p>100 daraja. Bitta maqsad: tirik qoling.<br>Tangalarni yig‘ing, tuzoqlardan o‘ting.</p><button class="obtn" id="startBtn">▶ BOSHLASH</button><p class="hint">← → yoki A / D — yurish · SPACE — sakrash<br>Telefon: pastdagi tugmalar · P / ESC — pauza</p></div>
</div>
<div id="ctrl">
<div class="movement"><button class="cb" id="bL" aria-label="Chapga yurish">◀</button><button class="cb" id="bR" aria-label="O‘ngga yurish">▶</button></div>
<span id="controlHint">TANGALARNI YIG‘ING</span>
<button class="cb jump" id="bJ" aria-label="Sakrash">SAKRA ▲</button>
</div>
</main>
<script src="game.js"></script>
</body>
</html>
