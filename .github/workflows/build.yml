name: Build HellRun Android and Windows
on:
  push:
    branches: [codex/hellrun-android-windows-audio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/bundle.cjs --steam
      - run: npm run test:steam
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HellRun-browser-checks
          path: |
            verification/
            !verification/**/smoke-profile/**
          retention-days: 30
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and verify APK
        run: bash scripts/build-android.sh
      - name: Preserve APK signing tool for private release signing
        run: |
          mkdir -p build/signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/signing-tool/
      - uses: actions/upload-artifact@v4
        with:
          name: HellRun-Android-signing-tool
          path: build/signing-tool/apksigner.jar
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: HellRun-Android
          path: release/HellRun-Android.apk
          retention-days: 30
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Android device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HellRun-Android-checks
          path: |
            verification/
            !verification/**/smoke-profile/**
          retention-days: 30
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:windows
      - name: Run the portable EXE
        shell: pwsh
        run: |
          $env:HELLRUN_VERIFY_DIR = Join-Path $PWD "verification"
          $process = Start-Process -FilePath ".\release\HellRun-Windows-x64.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Windows app exited with code $($process.ExitCode)" }
          if (-not (Test-Path ".\verification\windows-smoke.json")) { throw "Windows smoke result missing" }
          Get-Content ".\verification\windows-smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: HellRun-Windows
          path: release/HellRun-Windows-x64.exe
          retention-days: 30
      - run: npm run build:steam
      - name: Run the Steam depot executable
        shell: pwsh
        run: |
          $env:HELLRUN_VERIFY_DIR = Join-Path $PWD "verification/steam"
          $process = Start-Process -FilePath ".\release-steam\win-unpacked\HellRun Hardcore.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Steam executable exited with code $($process.ExitCode)" }
          if (-not (Test-Path ".\verification\steam\windows-smoke.json")) { throw "Steam executable result missing" }
          $result = Get-Content ".\verification\steam\windows-smoke.json" | ConvertFrom-Json
          if ($result.channel -ne "steam-offline") { throw "Incorrect Steam build profile" }
      - uses: actions/upload-artifact@v4
        with:
          name: HellRun-Steam-Windows
          path: release-steam/win-unpacked/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HellRun-Windows-checks
          path: |
            verification/
            !verification/**/smoke-profile/**
          retention-days: 30
