name: Publish HellRun Public Beta

on:
  push:
    branches: [codex/hellrun-public-beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hellrun-public-beta
  cancel-in-progress: true

env:
  RELEASE_TAG: v2.5.0-beta.1

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/bundle.cjs --steam
      - run: npm run test:steam

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: bash scripts/build-android.sh
      - name: Verify persistent release APK matches the generated build
        shell: bash
        run: |
          base64 --decode .github/release-assets/HellRun-Android.apk.b64 > release/HellRun-Android-persistent.apk
          python3 - <<'PY'
          import hashlib, zipfile
          def payload(path):
              with zipfile.ZipFile(path) as archive:
                  return {
                      name: hashlib.sha256(archive.read(name)).hexdigest()
                      for name in archive.namelist()
                      if not name.startswith("META-INF/")
                  }
          assert payload("release/HellRun-Android.apk") == payload("release/HellRun-Android-persistent.apk")
          PY
          mv release/HellRun-Android-persistent.apk release/HellRun-Android.apk
      - name: Run persistent APK on an Android device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-beta-android
          path: release/HellRun-Android.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:windows
      - name: Run the portable EXE
        shell: pwsh
        run: |
          $env:HELLRUN_VERIFY_DIR = Join-Path $PWD "verification"
          $process = Start-Process -FilePath ".\release\HellRun-Windows-x64.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Windows app exited with code $($process.ExitCode)" }
          if (-not (Test-Path ".\verification\windows-smoke.json")) { throw "Windows smoke result missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: public-beta-windows
          path: release/HellRun-Windows-x64.exe
          retention-days: 30

  release:
    needs: [checks, android, windows]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES: |
        Bu HellRun Hardcore 2.5.0 ommaviy sinov versiyasi. Steam uchun yakuniy reliz emas.

        Yuklab olish:
        - Android: HellRun-Android.apk
        - Windows 10/11 x64: HellRun-Windows-x64.exe

        Sinovda tekshiring: boshqaruv, ovoz, 100 daraja, nazorat nuqtalari, 3 ta jon, skinlar, 18 til va saqlash.
        Pulli xaridlar ulanmagan. Tangalar o'yinda yig'iladi.

        Xato topsangiz, Issues bo'limida qurilma, daraja va xatoni takrorlash qadamlarini yozing.

        This is a public test build of HellRun Hardcore 2.5.0, not the final Steam release.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-beta-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: public-beta-windows
          path: dist
      - name: Create checksums
        run: |
          cd dist
          sha256sum HellRun-Android.apk HellRun-Windows-x64.exe > SHA256SUMS.txt
      - name: Publish or refresh pre-release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/HellRun-Android.apk dist/HellRun-Windows-x64.exe dist/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --prerelease --title "HellRun Hardcore 2.5.0 Public Beta 1" --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" dist/HellRun-Android.apk dist/HellRun-Windows-x64.exe dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "HellRun Hardcore 2.5.0 Public Beta 1" --notes "$RELEASE_NOTES"
          fi
